<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Animated avatar of Dhananjay, a software engineer coding at his desk with code scrolling on the monitor">
  <defs>
    <clipPath id="screen"><rect x="50" y="44" width="220" height="112" rx="4"/></clipPath>
    <clipPath id="frame"><rect x="1" y="1" width="318" height="318" rx="28"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <g id="code">
      <rect x="0" y="0" width="54" height="6" rx="3" fill="#ff7b72"/><rect x="60" y="0" width="70" height="6" rx="3" fill="#d2a8ff"/>
      <rect x="14" y="14" width="40" height="6" rx="3" fill="#79c0ff"/><rect x="60" y="14" width="96" height="6" rx="3" fill="#a5d6ff"/>
      <rect x="14" y="28" width="64" height="6" rx="3" fill="#7ee787"/><rect x="84" y="28" width="38" height="6" rx="3" fill="#ffa657"/>
      <rect x="28" y="42" width="110" height="6" rx="3" fill="#8b949e"/>
      <rect x="28" y="56" width="46" height="6" rx="3" fill="#d2a8ff"/><rect x="80" y="56" width="60" height="6" rx="3" fill="#79c0ff"/>
      <rect x="14" y="70" width="30" height="6" rx="3" fill="#ff7b72"/><rect x="50" y="70" width="84" height="6" rx="3" fill="#7ee787"/>
      <rect x="0" y="84" width="22" height="6" rx="3" fill="#ffa657"/>
      <rect x="0" y="98" width="62" height="6" rx="3" fill="#ff7b72"/><rect x="68" y="98" width="50" height="6" rx="3" fill="#a5d6ff"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="320" height="320" fill="#0d1117"/>
    <rect x="0" y="0" width="320" height="320" fill="url(#glow)"/>

    <!-- floating symbols -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="bold" font-size="16">
      <text x="22" y="240" fill="#3fb950" opacity="0">{ }
        <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -60" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="276" y="200" fill="#58a6ff" opacity="0">&lt;/&gt;
        <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="1.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -60" dur="5s" begin="1.7s" repeatCount="indefinite"/>
      </text>
      <text x="26" y="140" fill="#d2a8ff" opacity="0" font-size="14">01
        <animate attributeName="opacity" values="0;0.8;0" dur="5s" begin="3.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -50" dur="5s" begin="3.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- monitor -->
    <rect x="40" y="34" width="240" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="50" y="44" width="220" height="112" rx="4" fill="#0a0d12"/>
    <g clip-path="url(#screen)">
      <g>
        <use href="#code" x="62" y="54"/>
        <use href="#code" x="62" y="166"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -112" dur="7s" repeatCount="indefinite"/>
      </g>
    </g>
    <rect x="150" y="166" width="20" height="14" fill="#30363d"/>

    <!-- person -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="3.2s" repeatCount="indefinite"/>
      <!-- hoodie -->
      <path d="M64 300 Q66 214 160 204 Q254 214 256 300 Z" fill="#3d5294"/>
      <path d="M130 207 Q160 228 190 207" fill="none" stroke="#2c3d73" stroke-width="10" stroke-linecap="round"/>
      <line x1="150" y1="220" x2="147" y2="246" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round"/>
      <line x1="170" y1="220" x2="173" y2="246" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round"/>
      <path d="M84 262 Q90 228 116 232 L128 262 Z" fill="#3d5294"/>
      <path d="M236 262 Q230 228 204 232 L192 262 Z" fill="#3d5294"/>
      <!-- neck -->
      <rect x="148" y="184" width="24" height="24" rx="8" fill="#a86b3c"/>
      <!-- headphones around neck -->
      <path d="M126 200 Q160 226 194 200" fill="none" stroke="#58a6ff" stroke-width="6" stroke-linecap="round"/>
      <rect x="118" y="190" width="14" height="20" rx="6" fill="#1f6feb"/>
      <rect x="188" y="190" width="14" height="20" rx="6" fill="#1f6feb"/>
      <!-- ears -->
      <ellipse cx="126" cy="160" rx="6" ry="9" fill="#b97a47"/>
      <ellipse cx="194" cy="160" rx="6" ry="9" fill="#b97a47"/>
      <!-- head -->
      <ellipse cx="160" cy="157" rx="34" ry="38" fill="#c68642"/>
      <!-- hair -->
      <path d="M125 156 Q118 110 160 108 Q204 108 196 156 Q194 136 182 128 Q160 136 136 128 Q127 138 125 156 Z" fill="#1c1714"/>
      <path d="M140 124 Q160 112 186 124" fill="none" stroke="#2a221e" stroke-width="4" stroke-linecap="round"/>
      <!-- brows -->
      <path d="M139 146 Q147 142 155 146" fill="none" stroke="#1c1714" stroke-width="3" stroke-linecap="round"/>
      <path d="M165 146 Q173 142 181 146" fill="none" stroke="#1c1714" stroke-width="3" stroke-linecap="round"/>
      <!-- eyes (blink) -->
      <ellipse cx="147" cy="158" rx="3.5" ry="4" fill="#1c1714">
        <animate attributeName="ry" values="4;4;0.5;4" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="173" cy="158" rx="3.5" ry="4" fill="#1c1714">
        <animate attributeName="ry" values="4;4;0.5;4" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
      <!-- glasses -->
      <rect x="136" y="149" width="22" height="17" rx="5" fill="#58a6ff" fill-opacity="0.12" stroke="#e6edf3" stroke-width="2"/>
      <rect x="162" y="149" width="22" height="17" rx="5" fill="#58a6ff" fill-opacity="0.12" stroke="#e6edf3" stroke-width="2"/>
      <line x1="158" y1="156" x2="162" y2="156" stroke="#e6edf3" stroke-width="2"/>
      <!-- smile -->
      <path d="M150 177 Q160 184 170 177" fill="none" stroke="#5a3420" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- laptop (back of the lid) -->
    <rect x="98" y="212" width="124" height="54" rx="7" fill="#c9d1d9"/>
    <rect x="98" y="212" width="124" height="54" rx="7" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <text x="160" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="bold" font-size="18" fill="#1f6feb">&lt;/&gt;
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <!-- desk -->
    <rect x="0" y="266" width="320" height="54" fill="#161b22"/>
    <rect x="0" y="264" width="320" height="6" fill="#30363d"/>

    <!-- coffee mug with steam -->
    <rect x="246" y="238" width="26" height="28" rx="5" fill="#f78166"/>
    <path d="M272 244 q12 0 12 9 q0 9 -12 9" fill="none" stroke="#f78166" stroke-width="4"/>
    <g fill="none" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round">
      <path d="M254 232 q-5 -7 0 -14 q5 -7 0 -14">
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 4;0 -6" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M264 232 q-5 -7 0 -14 q5 -7 0 -14">
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 4;0 -6" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- tiny status led on desk -->
    <circle cx="40" cy="282" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e">shipping</text>
  </g>
  <rect x="1" y="1" width="318" height="318" rx="28" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
